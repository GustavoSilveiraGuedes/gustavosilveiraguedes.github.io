# --- Conexao com o MySQL ---
# Ajuste usuario e senha conforme o seu ambiente
spring.datasource.url=jdbc:mysql://localhost:3306/algbra?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=SUA_SENHA_AQUI
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
# none: a tabela 'usuario' ja existe (criada pelo seu script SQL),
# entao o Hibernate NAO deve tentar criar/alterar nada.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# --- Porta do servidor ---
server.port=8080